name: Thu thập tâm lý crypto

on:
  schedule:
    - cron: "17 * * * *"   # mỗi giờ, vào phút 17 (giờ UTC)
  workflow_dispatch:        # cho phép bấm chạy tay

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Giữ mô hình AI giữa các lần chạy
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-twitter-roberta-v1

      - name: Cài thư viện
        run: pip install -r collector/requirements.txt

      - name: Thu thập, lọc, chấm điểm, tổng hợp
        run: python collector/collect.py

      - name: Lưu dữ liệu vào kho
        run: |
          git config user.name "sentiment-bot"
          git config user.email "sentiment-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Không có thay đổi."
            exit 0
          fi
          git commit -m "Cập nhật dữ liệu $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
