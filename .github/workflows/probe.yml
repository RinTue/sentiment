name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: python
        run: |
          import re, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36", "Accept": "text/html,application/json"}
          for u in ["https://www.strategy.com/purchases", "https://www.strategy.com/api/bitcoin/purchases", "https://bitbo.io/treasuries/microstrategy/"]:
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30)
                  t = r.read().decode("utf-8", "replace")
                  dates = re.findall(r"20\d\d-\d\d-\d\d|\b\d{1,2}/\d{1,2}/20\d\d\b|(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]* \d{1,2},? 20\d\d", t)
                  print(f"::notice::{u} -> {r.status} {len(t)}B dates={len(dates)} sample={dates[:6]} nextdata={'__NEXT_DATA__' in t}")
              except Exception as ex:
                  print(f"::notice::{u} -> ERR {str(ex)[:150]}")
