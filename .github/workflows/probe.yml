name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: python
        run: |
          import re, html, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"}
          t = urllib.request.urlopen(urllib.request.Request("https://bitbo.io/treasuries/microstrategy/", headers=UA), timeout=30).read().decode("utf-8", "replace")
          rows = []
          for tr in re.findall(r"<tr[^>]*>(.*?)</tr>", t, re.S | re.I):
              cells = [html.unescape(re.sub(r"<[^>]+>", "", c)).strip() for c in re.findall(r"<t[dh][^>]*>(.*?)</t[dh]>", tr, re.S | re.I)]
              if cells and re.match(r"\d{1,2}/\d{1,2}/20\d\d$", cells[0]):
                  rows.append("|".join(c.replace(",", "").replace("$", "")[:14] for c in cells[:4]))
          print(f"::notice::N={len(rows)} head={[c for c in re.findall(r'<th[^>]*>(.*?)</th>', t, re.S)][:6]}")
          chunk = ""
          for r in rows:
              if len(chunk) + len(r) > 3500:
                  print("::notice::" + chunk); chunk = ""
              chunk += r + ";"
          if chunk: print("::notice::" + chunk)
