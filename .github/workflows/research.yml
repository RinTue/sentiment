name: Nghiên cứu dự báo

# Dựng bảng chỉ số theo ngày, sàng lọc khả năng dự báo xu hướng 30/90 ngày (collector/research.py)
# và tính Bối cảnh thị trường cho trang Tổng quan (collector/context.py).
# Chạy riêng để không làm chậm bộ thu thập hằng giờ; không bao giờ báo lỗi đỏ (script luôn thoát mã 0).
on:
  workflow_dispatch:
  schedule:
    - cron: "41 23 * * *"    # 06:41 sáng giờ Việt Nam, mỗi ngày (sau khi Mỹ đóng cửa và ETF công bố)
    - cron: "23 2 * * *"     # 09:23 dự phòng, vì GitHub hay bỏ lượt chạy theo lịch (chạy lại cũng không sao)

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài thư viện
        run: pip install requests numpy pandas scikit-learn feedparser
      - name: Dựng dữ liệu và sàng lọc
        run: python collector/research.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
      - name: Tính bối cảnh thị trường
        run: python collector/context.py
      - name: Lưu kết quả
        run: |
          git config user.name "sentiment-bot"
          git config user.email "sentiment-bot@users.noreply.github.com"
          git add data/research.json data/research_features.csv data/compass_cache.json data/context.json data/context_log.csv || true
          if git diff --cached --quiet; then echo "Không có thay đổi."; exit 0; fi
          git commit -m "Bối cảnh thị trường $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 15))
          done
          echo "Không đẩy được, lần sau thử lại."
