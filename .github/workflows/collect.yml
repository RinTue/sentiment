name: Thu thập tâm lý crypto

on:
  schedule:
    - cron: "17 * * * *"   # mỗi giờ, vào phút 17 (giờ UTC)
  workflow_dispatch:        # cho phép bấm chạy tay

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            collector/requirements.txt
            collector/requirements-cb.txt

      - name: Giữ mô hình AI giữa các lần chạy
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v2
          restore-keys: hf-twitter-roberta-v1

      - name: Cài thư viện
        run: pip install -r collector/requirements.txt

      - name: Thu thập, lọc, chấm điểm, tổng hợp
        run: python collector/collect.py
        env:   # cả ba đều không bắt buộc; để trống vẫn chạy
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Thử nghiệm CryptoBERT (so sánh, không ảnh hưởng điểm chính)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          pip install -r collector/requirements-cb.txt
          python collector/cryptobert.py

      - name: Lưu dữ liệu vào kho
        run: |
          git config user.name "sentiment-bot"
          git config user.email "sentiment-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Không có thay đổi."
            exit 0
          fi
          git commit -m "Cập nhật dữ liệu $(date -u +%Y-%m-%dT%H:%MZ)"
          # Nếu có lần chạy khác vừa lưu trước, giữ bản dữ liệu mới nhất của lần này (-X theirs khi rebase).
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
